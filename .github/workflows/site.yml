# Puts `main` on the live address. Every push to `main` builds the site, uploads it to Cloudflare Pages, waits for the
# live address to serve exactly this build, and then runs the journeys against it. `ci` has already tested the same
# commit before it merged; this checks what visitors get.
#
#   build    builds the site with this commit's name in `version.txt` (no secret is in the job)
#   deploy   the only job that holds the Cloudflare token, and only for `main`
#   live     waits for the live address to serve this build, then runs the journeys against it in Chromium
#
# The job names differ from `ci`'s (`site-build`), because GitHub matches a required check by its name alone and
# `main`'s required checks are `ci`'s. Every action is pinned to a commit.
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run that is part way through: it may be in the middle of a deploy.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          SITE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist
          if-no-files-found: error

  # The ref is checked here, so a hand-started run on a branch can never reach the one job that holds the token.
  deploy:
    needs: site-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - name: Upload it to Cloudflare Pages
        run: pnpm exec wrangler pages deploy dist --project-name automataframework --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'

  # The wait comes first and alone, so the other journeys never judge a build Cloudflare has not switched to yet.
  live:
    needs: deploy
    runs-on: ubuntu-latest
    # Playwright's own image for the locked version, pinned by digest: Chromium is in it.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    env:
      BASE_URL: https://automataframework.com
      EXPECT_SITE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright is the lockfile's version
        run: test "$(pnpm exec playwright --version)" = "Version 1.63.0"
      - name: Wait for the live address to serve this build
        # The file comes before `--project`, which would otherwise read it as a second project name.
        run: pnpm test:journeys tests/journeys/live.journey.ts --project chromium
      - name: Run the other journeys against the live address
        run: pnpm test:journeys --project chromium --grep-invert "the live address"
