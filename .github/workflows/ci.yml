# `plan` says how much this run tests. `check` runs the static checks and the Node tests. `build` makes the site, and
# `journeys` drives it in real Chromium, WebKit and Firefox. `gate` is the one check that says all of it passed. Every
# action is pinned to a commit.
#
# How much is tested (the Owner, 2026-11-15): the whole Node suite runs on every run, since it takes seconds. While a
# pull request is a draft, the journeys play in Chromium only and stop at their first failure, and every check's name
# starts with `quick `, which `main` never requires. The whole suite runs once the pull request is ready for review, on
# every push to main, in the merge queue, and on a draft that carries the `full-tests` label.
name: ci

on:
  pull_request:
    # `ready_for_review` starts the whole suite as a draft is handed over; `labeled` lets a thread ask for it sooner.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main, 'merge-queue/**']
  # GitHub's merge queue tests each pull request merged with current `main` before it lands. It runs the whole suite:
  # `plan` reads no diff for it, so everything is `true`.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A newer push stops the run it replaces, so no one waits on results that no longer count.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  # Runs on main are never cancelled, so every merge gets its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # How much this run tests, from the event and the files the pull request changes:
  #   docs   true when only Markdown that people read changed: `docs` passes every check main requires under its own
  #          name, and every job that tests is left out
  #   full   false on a draft without the `full-tests` label: the journeys in Chromium only, stopping at the first failure
  #   quick  `quick ` on a draft, `skipped ` on a docs-only run, and empty otherwise: the start of every check's name, so
  #          only a full run (or `docs`) wears the names main requires
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      docs: ${{ steps.plan.outputs.docs }}
      quick: ${{ steps.plan.outputs.docs == 'true' && 'skipped ' || steps.plan.outputs.full != 'true' && 'quick ' || '' }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          full=true docs=false
          # A diff GitHub cannot give (too large, or an error) runs everything, never less.
          if [ "$EVENT" = pull_request ] && [[ " $LABELS " != *" full-tests "* ]] &&
            changed="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)" && [ -n "$changed" ]; then
            printf 'This pull request changes:\n%s\n' "$changed"
            # Only Markdown that people read (CLAUDE.md and the notes under docs/, never the README, which a test reads).
            if ! grep -qvE '^(CLAUDE\.md|docs/.+\.md)$' <<<"$changed"; then
              docs=true
            elif [ "$DRAFT" = true ]; then
              full=false
            fi
          fi
          echo "docs=$docs full=$full"
          { echo "docs=$docs"; echo "full=$full"; } >> "$GITHUB_OUTPUT"

  # A pull request that changes only Markdown that people read has nothing to test (the Owner, 2026-11-15). This job
  # stands in for every check main requires, under its exact name, and passes at once. On any other run it is left out.
  docs:
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    name: ${{ needs.plan.outputs.docs == 'true' && matrix.check || format('docs only {0}', matrix.check) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check:
          - 'check'
          - 'build'
    env:
      CHECK: ${{ matrix.check }}
    steps:
      - run: echo "Only Markdown that people read changed, so there is nothing to test, and $CHECK passes."

  check:
    needs: plan
    if: needs.plan.outputs.docs != 'true'
    name: ${{ needs.plan.outputs.quick }}check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm test:node

  # The site as it would be served, for the journeys to drive.
  build:
    needs: plan
    if: needs.plan.outputs.docs != 'true'
    name: ${{ needs.plan.outputs.quick }}build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          SITE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist
          if-no-files-found: error

  # The built site in real browsers, served by `wrangler pages dev` the way Cloudflare Pages serves it. Playwright's own
  # image for the locked version, pinned by digest, holds the browsers and their system libraries, so nothing is
  # installed from the runner's package mirror (the Owner, 2026-11-21). The runner's own user (1001) owns the checkout.
  journeys:
    needs: [plan, build]
    if: needs.plan.outputs.docs != 'true'
    name: ${{ needs.plan.outputs.quick }}journeys
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    env:
      ENGINES: ${{ needs.plan.outputs.full == 'true' && '--project chromium --project webkit --project firefox' || '--project chromium --max-failures=1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The image's browsers fit only the Playwright they came with: say so plainly if the lockfile moves without it.
      - name: The image's Playwright is the lockfile's
        run: test "$(pnpm exec playwright --version)" = "Version 1.63.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - run: pnpm test:journeys $ENGINES
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: journeys-traces
          path: test-results
          if-no-files-found: ignore

  # The commits and the words of the pull request (`scripts/check-commit-authors.ts`), checked inside `gate` so that the
  # merge queue, which waits only on `gate`, checks them too. A merge queue run has no pull request in its event, so the
  # script takes the number from the queue's branch. A push to `main` has no pull request, so it is left out there. It
  # may write the pull request, only to take off the footer the cloud tool appends.
  commit-authors:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - run: node scripts/check-commit-authors.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}

  # The one aggregate check main requires beside `check` and `build`. It passes only when every job that applies ran
  # and passed and every other was left out by `plan`, so a job skipped because something before it failed never counts
  # as passed. A draft's is `quick gate`, which main never requires. A new job is added to both lists.
  gate:
    needs: [plan, docs, check, build, journeys, commit-authors]
    if: always()
    name: ${{ needs.plan.outputs.quick == 'quick ' && 'quick ' || '' }}gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check that applies ran and passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          GATE: |
            const results = JSON.parse(process.env.RESULTS)
            const applies = JSON.parse(process.env.APPLIES)
            let ok = true
            for (const [job, want] of Object.entries(applies)) {
              const got = results[job]?.result
              const good = want ? got === 'success' : got === 'skipped'
              console.log(`${good ? 'ok ' : 'NO '} ${job}: ${want ? 'applies' : 'not applicable'}, ${got}`)
              ok &&= good
            }
            for (const job of Object.keys(results)) {
              if (!(job in applies)) {
                console.log(`NO  ${job}: the gate does not know this job`)
                ok = false
              }
            }
            process.exit(ok ? 0 : 1)
          APPLIES: >-
            {"plan": true, "commit-authors": ${{ github.event_name != 'push' }}, "docs": ${{ needs.plan.outputs.docs == 'true' }}, "check": ${{ needs.plan.outputs.docs != 'true' }}, "build": ${{ needs.plan.outputs.docs != 'true' }}, "journeys": ${{ needs.plan.outputs.docs != 'true' }}}
        run: |
          node --input-type=module -e "$GATE"
        shell: bash
