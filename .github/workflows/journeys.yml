# The journeys: the built site driven in real Chromium, WebKit and Firefox, in six pieces side by side, each piece playing
# its share of every engine one engine after another. The Owner asked on 2026-11-15 for each engine in two shards (6
# jobs) and an `engines` check per engine, so a failing engine is named; on 2026-11-25 the Owner chose the workflow
# page's Settings, which allow 6 browser pieces. A failing engine is still named: each piece's log prints one result
# line per engine, and `ci`'s `gate` names each engine that failed and in which piece. Called by `ci` (with the
# stand-in game) and by `site` (with the real game). Every action is pinned to a commit.
name: journeys

on:
  workflow_call:
    inputs:
      site-artifact:
        description: The name of the artifact, uploaded by the calling workflow, that holds the built site (dist/).
        type: string
        required: true
      engines:
        description: The engines to play, as a JSON list. A draft of `ci` plays Chromium only; the rest pass as left out.
        type: string
        default: '["chromium", "webkit", "firefox"]'
      max-failures:
        description: Stop after this many failed journeys; 0 plays them all. A draft of `ci` stops at the first.
        type: number
        default: 0
      only-changed:
        description: Play only the journeys changed since `origin/main` (Playwright's `--only-changed`). A draft of `ci`
          that changed journeys and not the site asks for it.
        type: boolean
        default: false
      full:
        description: A full run plays every journey file, the pieces filled from the times `main` recorded, and leaves
          each engine's file list and report for `ci`'s `gate` to check. A draft of `ci` plays `--shard` pieces instead.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # GitHub runs 20 of this organization's jobs at once; the 9 journey jobs a run had (6 shards and 3 `engines`) are
  # now 6.
  pieces:
    name: pieces (${{ matrix.piece }}/6)
    runs-on: ubuntu-latest
    # Playwright's own image for the version the lockfile pins: the browsers and the system libraries they need are
    # already in it, so nothing comes from the runner's package mirror, whose slow days left `install-deps` hanging
    # until the job's timeout. Pinned by digest; moving Playwright in the lockfile moves this tag and digest with it.
    # The runner's own user (1001), so the checkout, the caches and Firefox's home folder all belong to it.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    permissions:
      actions: read
      contents: read
    strategy:
      # Stopping early (a draft) stops the other pieces too; a whole run lets every piece finish.
      fail-fast: ${{ inputs.max-failures != 0 }}
      matrix:
        piece: [1, 2, 3, 4, 5, 6]
    env:
      ONLY: ${{ inputs.only-changed && '--only-changed=origin/main' || '' }}
    steps:
      # The whole history, so `--only-changed` can compare with `origin/main`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The image has no `gh`, so the built site comes through the artifact action.
      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.site-artifact }}
          path: dist
      # The image's browsers fit only the Playwright they came with: say so plainly if the lockfile moves without it.
      - name: The image's Playwright is the lockfile's
        run: test "$(pnpm exec playwright --version)" = "Version 1.63.0"
      # A full run fills its pieces from the newest times a full run recorded: from `main`, or from this branch while
      # `main` has none. With none yet, every file counts the same.
      - name: Find the recorded times
        id: times
        if: inputs.full
        run: node scripts/browser-fill.ts pick
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
      - name: Download the recorded times
        if: inputs.full && steps.times.outputs.run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-times
          run-id: ${{ steps.times.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/times
      # Each engine's share of this piece, one engine after another, so a piece's log has one result line per engine and
      # `ci`'s `gate` can name the engine that failed. Every engine plays even after one fails, so a whole run reports
      # them all. Each engine keeps its own pictures and its own Playwright results (a failed journey's trace), since
      # the journeys name a picture's file without the browser in it and Playwright empties its results folder on start.
      # A full run plays this piece's files from the fill (`scripts/browser-fill.ts`), and leaves the engine's file list
      # and JSON report; a draft plays Playwright's own `--shard`. One server serves every engine, as Cloudflare Pages
      # would serve the folder, started in this same step so it lives as long as the journeys do: `BASE_URL` points them
      # at it, so Playwright does not start (and stop) a server of its own for each engine.
      - name: Every engine's share of piece ${{ matrix.piece }}
        env:
          ENGINES: ${{ inputs.engines }}
          PIECE: ${{ matrix.piece }}
          MAX_FAILURES: ${{ inputs.max-failures }}
          FULL: ${{ inputs.full }}
          BASE_URL: http://127.0.0.1:8788
          WRANGLER_SEND_METRICS: 'false'
          UP: |
            for (let second = 0; second < 120; second += 1) {
              try {
                if ((await fetch('http://127.0.0.1:8788/')).ok) process.exit(0)
              } catch {}
              await new Promise((resolve) => setTimeout(resolve, 1000))
            }
            console.error('The site did not answer at http://127.0.0.1:8788/ within 120 seconds.')
            process.exit(1)
        run: |
          mkdir -p ci-out/results ci-out/screens ci-out/test-results ci-out/times
          pnpm exec wrangler pages dev dist --ip 127.0.0.1 --port 8788 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          node --input-type=module -e "$UP" || { cat "$RUNNER_TEMP/wrangler.log"; exit 1; }
          failed=0
          for engine in $(node -p 'JSON.parse(process.env.ENGINES).join(" ")'); do
            result=failed
            if [ "$FULL" = true ]; then
              list="ci-out/times/list-$PIECE-$engine.json"
              if pnpm exec playwright test --list --reporter=json --project "$engine" > "$list" &&
                mine="$(node scripts/browser-fill.ts files "$PIECE" "$list" "$RUNNER_TEMP/times/test-times.json")"; then
                mapfile -t files <<<"$mine"
                printf 'piece %s plays, in %s:\n%s\n' "$PIECE" "$engine" "$mine"
                if PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/ci-out/times/report-$PIECE-$engine.json" pnpm test:journeys \
                  --project "$engine" --reporter=list,json --max-failures="$MAX_FAILURES" \
                  --output="ci-out/test-results/$engine" "${files[@]}"; then result=passed; fi
              fi
            elif pnpm test:journeys --project "$engine" --shard="$PIECE/6" --max-failures="$MAX_FAILURES" \
              --output="ci-out/test-results/$engine" $ONLY; then result=passed; fi
            [ "$result" = passed ] || failed=1
            echo "$engine $result in piece $PIECE/6"
            echo "$engine $result" >> "ci-out/results/piece-$PIECE.txt"
            if [ -d tests/journeys/__screenshots__ ]; then
              mkdir -p "ci-out/screens/$engine"
              cp -r tests/journeys/__screenshots__/. "ci-out/screens/$engine"/
              rm -rf tests/journeys/__screenshots__
            fi
          done
          exit "$failed"
      # What `ci`'s `gate` checks on a full run: each engine's file list and report from this piece.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && inputs.full
        with:
          name: times-piece-${{ matrix.piece }}
          path: ci-out/times/
          if-no-files-found: ignore
          overwrite: true
      # What `ci`'s `gate` reads to name a failing engine. A job run again replaces its own file.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: results-piece-${{ matrix.piece }}
          path: ci-out/results/
          if-no-files-found: ignore
          overwrite: true
      # Pictures a person looks at (the drunk-grandma check); nothing compares them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screens-piece-${{ matrix.piece }}
          path: ci-out/screens/
          if-no-files-found: ignore
          overwrite: true
      # What a failed journey leaves: Playwright's trace and the error's context for each, per engine, so a failure that
      # does not come again can still be read. Open a trace with `pnpm exec playwright show-trace <file>`.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results-piece-${{ matrix.piece }}
          path: ci-out/test-results/**
          retention-days: 14
          if-no-files-found: ignore
