# The Cloudflare Pages project the site is deployed to (automataframework.pages.dev) and the folder it is built in.
name = "automataframework"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-30"  # the newest date the installed workerd supports

# The waitlist's sign-ups. The id is the Owner's database (spec 2026-11-27-waitlist-design.md, Owner step 3).
[[d1_databases]]
binding = "DB"
database_name = "automata-waitlist"
database_id = "17412598-fb58-4663-aa58-39144adf1f3f"

# The mailer Worker (mailer/), which sends the confirmation email.
[[services]]
binding = "MAILER"
service = "automata-mailer"
