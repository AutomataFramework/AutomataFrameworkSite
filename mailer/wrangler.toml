# The waitlist's mailer: sends the confirmation email (Pages Functions cannot hold a send_email binding) and runs the
# daily clean-up. It has no address of its own: the site reaches it only through its service binding.
name = "automata-mailer"
main = "src/index.ts"
compatibility_date = "2026-09-30"
workers_dev = false
preview_urls = false

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["hello@automataframework.com"]

[[d1_databases]]
binding = "DB"
database_name = "automata-waitlist"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../migrations"

# Just after each UTC midnight, so a sender key lives one day.
[triggers]
crons = ["5 0 * * *"]
